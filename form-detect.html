<!-- Netlify Forms detection: do not link, do not delete -->
<!--
  Este arquivo existe só para o Netlify registrar os 3 formulários "contato-en", "contato-pt" e "contato-es" no
  deploy. Precisa ter EXATAMENTE os mesmos campos (name=) do <form> real em
  /<idioma>/contato/index.html - se divergirem, o painel mostra o último conjunto lido.
  Não é linkado em lugar nenhum e retorna 404 via netlify.toml.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<title>Nexyss - form detection</title>
</head>
<body>
<form name="contato-en" method="POST" action="/en/contato/obrigado.html" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contato-en" />
  <input type="hidden" name="origem" value="" />
  <input name="bot-field" />
  <input name="nome" type="text" />
  <input name="email" type="email" />
  <input name="empresa" type="text" />
  <select name="interesse">
    <option value="crm">crm</option>
    <option value="education">education</option>
    <option value="marketing">marketing</option>
    <option value="finance">finance</option>
    <option value="hr">hr</option>
    <option value="ai">ai</option>
    <option value="integrations">integrations</option>
    <option value="consulting">consulting</option>
    <option value="sobre">sobre</option>
    <option value="platform">platform</option>
    <option value="undecided">undecided</option>
  </select>
  <textarea name="mensagem"></textarea>
  <button type="submit">Enviar</button>
</form>

    <option value="finance">finance</option>
    <option value="hr">hr</option>
    <option value="ai">ai</option>
    <option value="integrations">integrations</option>
    <option value="consulting">consulting</option>
    <option value="sobre">sobre</option>
    <option value="platform">platform</option>
    <option value="undecided">undecided</option>
  </select>
  <textarea name="mensagem"></textarea>
  <button type="submit">Enviar</button>
</form>
<form name="contato-es" method="POST" action="/es/contato/obrigado.html" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contato-es" />
  <input type="hidden" name="origem" value="" />
  <input name="bot-field" />
  <input name="nome" type="text" />

  <select name="interesse">

    <option value="finance">finance</option>
    <option value="hr">hr</option>

    <option value="integrations">integrations</option>
    <option value="consulting">consulting</option>
    <option value="sobre">sobre</option>
    <option value="platform">platform</option>

  </select>

</form>
</body>
</html>
